<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>САЙТЫ ГДЗ 4.0</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-dark: #0a0a0f;
            --glass-bg: rgba(240, 230, 255, 0.06);
            --glass-border: rgba(200, 180, 255, 0.12);
            --text-primary: #ffffff;
            --text-secondary: #d0c4e9;
            --accent-purple: #c8b4ff;
            --accent-purple-bright: #e4d4ff;
            --accent-purple-dim: rgba(200, 180, 255, 0.15);
            --shadow-glow: rgba(200, 180, 255, 0.3);
            --glow-intense: rgba(200, 180, 255, 0.8);
            --font-main: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
        }
        body {
            font-family: var(--font-main);
            background: linear-gradient(135deg, #1a1a2e 0%, #0f0f1e 50%, #1a1a2e 100%);
            color: var(--text-primary);
            overflow: hidden;
            min-height: 100vh;
            position: relative;
        }
        
        /* Liquid Glass Effect */
        .liquid-glass {
            background: linear-gradient(
                135deg,
                rgba(255, 255, 255, 0.05) 0%,
                rgba(255, 255, 255, 0.02) 30%,
                rgba(255, 255, 255, 0.01) 50%,
                rgba(255, 255, 255, 0.02) 70%,
                rgba(255, 255, 255, 0.05) 100%
            );
            backdrop-filter: blur(60px) saturate(200%) brightness(1.1);
            -webkit-backdrop-filter: blur(60px) saturate(200%) brightness(1.1);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 
                0 8px 32px rgba(0, 0, 0, 0.5),
                0 4px 16px rgba(200, 180, 255, 0.15),
                inset 0 1px 0 rgba(255, 255, 255, 0.1),
                inset 0 -1px 0 rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
        }
        
        .liquid-glass::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(
                circle at center,
                rgba(255, 255, 255, 0.12) 0%,
                rgba(255, 255, 255, 0.04) 30%,
                transparent 70%
            );
            animation: liquidFlow 8s ease-in-out infinite;
            pointer-events: none;
            filter: blur(40px);
        }
        
        .liquid-glass::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 200%;
            height: 100%;
            background: linear-gradient(
                120deg,
                transparent 0%,
                rgba(255, 255, 255, 0.1) 40%,
                rgba(200, 180, 255, 0.08) 50%,
                rgba(255, 255, 255, 0.1) 60%,
                transparent 100%
            );
            animation: liquidShimmer 7s ease-in-out infinite;
            pointer-events: none;
            filter: blur(10px);
        }
        
        @keyframes liquidFlow {
            0%, 100% { 
                transform: translate(0, 0) scale(1);
                opacity: 0.6;
            }
            25% { 
                transform: translate(20%, 10%) scale(1.1);
                opacity: 0.8;
            }
            50% { 
                transform: translate(-10%, 20%) scale(0.95);
                opacity: 0.7;
            }
            75% { 
                transform: translate(15%, -15%) scale(1.05);
                opacity: 0.9;
            }
        }
        
        @keyframes liquidShimmer {
            0% { 
                left: -100%; 
                opacity: 0;
            }
            40% {
                opacity: 1;
            }
            60% {
                opacity: 1;
            }
            100% { 
                left: 100%; 
                opacity: 0;
            }
        }
        
        /* Glowing Progress Bar */
        .lesson-progress {
            height: 6px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            overflow: visible;
            position: relative;
            margin-top: 12px;
        }
        
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #a78bfa, #c4b5fd, #e4d4ff);
            border-radius: 10px;
            position: relative;
            transition: width 0.5s ease;
            box-shadow: 
                0 0 20px rgba(200, 180, 255, 0.8),
                0 0 40px rgba(200, 180, 255, 0.5),
                0 0 60px rgba(200, 180, 255, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.4);
            animation: glowPulse 2s ease-in-out infinite;
        }
        
        .progress-bar::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.6), transparent);
            border-radius: 10px;
            animation: progressShine 2s ease-in-out infinite;
        }
        
        .progress-bar::after {
            content: '';
            position: absolute;
            top: -8px;
            right: -8px;
            width: 22px;
            height: 22px;
            background: radial-gradient(circle, #e4d4ff, #c4b5fd);
            border-radius: 50%;
            box-shadow: 
                0 0 20px rgba(200, 180, 255, 1),
                0 0 40px rgba(200, 180, 255, 0.6),
                0 0 60px rgba(200, 180, 255, 0.3),
                inset 0 0 8px rgba(255, 255, 255, 0.5);
            animation: markerGlow 2s ease-in-out infinite;
        }
        
        @keyframes glowPulse {
            0%, 100% {
                box-shadow: 
                    0 0 20px rgba(200, 180, 255, 0.8),
                    0 0 40px rgba(200, 180, 255, 0.5),
                    0 0 60px rgba(200, 180, 255, 0.3),
                    inset 0 1px 0 rgba(255, 255, 255, 0.4);
            }
            50% {
                box-shadow: 
                    0 0 30px rgba(200, 180, 255, 1),
                    0 0 60px rgba(200, 180, 255, 0.7),
                    0 0 90px rgba(200, 180, 255, 0.5),
                    inset 0 1px 0 rgba(255, 255, 255, 0.6);
            }
        }
        
        @keyframes progressShine {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(200%); }
        }
        
        @keyframes markerGlow {
            0%, 100% {
                box-shadow: 
                    0 0 20px rgba(200, 180, 255, 1),
                    0 0 40px rgba(200, 180, 255, 0.6),
                    0 0 60px rgba(200, 180, 255, 0.3),
                    inset 0 0 8px rgba(255, 255, 255, 0.5);
            }
            50% {
                box-shadow: 
                    0 0 30px rgba(200, 180, 255, 1),
                    0 0 60px rgba(200, 180, 255, 0.8),
                    0 0 90px rgba(200, 180, 255, 0.5),
                    inset 0 0 12px rgba(255, 255, 255, 0.7);
            }
        }
        
        /* Pill Menu by Ahmad */
        .footer {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 8px 16px;
            border-radius: 50px;
            background: linear-gradient(
                135deg,
                rgba(255, 255, 255, 0.18) 0%,
                rgba(255, 255, 255, 0.08) 50%,
                rgba(255, 255, 255, 0.12) 100%
            );
            backdrop-filter: blur(50px) saturate(200%) brightness(1.2);
            -webkit-backdrop-filter: blur(50px) saturate(200%) brightness(1.2);
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 
                0 8px 24px rgba(0, 0, 0, 0.4),
                0 4px 12px rgba(200, 180, 255, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.4),
                inset 0 -1px 0 rgba(0, 0, 0, 0.2);
            animation: pillFloat 3s ease-in-out infinite;
            z-index: 100;
            transition: all 0.3s ease;
            overflow: hidden;
        }
        
        .footer::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(
                circle at center,
                rgba(255, 255, 255, 0.2) 0%,
                transparent 60%
            );
            animation: pillGlow 4s ease-in-out infinite;
            filter: blur(20px);
        }
        
        @keyframes pillGlow {
            0%, 100% { 
                transform: translate(0, 0) scale(1);
                opacity: 0.5;
            }
            50% { 
                transform: translate(10%, 10%) scale(1.2);
                opacity: 0.8;
            }
        }
        
        .footer:hover {
            transform: translateY(-2px) scale(1.05);
            box-shadow: 
                0 8px 24px rgba(0, 0, 0, 0.4),
                0 0 30px rgba(200, 180, 255, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.4);
        }
        
        @keyframes pillFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-3px); }
        }
        
        .footer p {
            font-size: 0.75rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.95);
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
            letter-spacing: 0.5px;
            position: relative;
            z-index: 1;
        }
        
        .footer .version {
            display: none;
        }
        
        .snow-canvas { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            z-index: 0; 
            pointer-events: none; 
        }
        
        .app-wrapper {
            position: relative; 
            z-index: 1; 
            max-width: 480px; 
            width: 100%; 
            height: 100vh; 
            margin: 0 auto;
            display: flex; 
            flex-direction: column; 
            animation: slideIn 0.8s cubic-bezier(0.16,1,0.3,1);
        }
        
        @keyframes slideIn { 
            from { opacity: 0; transform: translateY(50px) scale(0.95); } 
            to { opacity: 1; transform: translateY(0) scale(1); } 
        }
        
        .header { 
            padding: 30px 20px 25px; 
            border-radius: 0 0 35px 35px; 
            animation: fadeInDown 1s cubic-bezier(0.16,1,0.3,1); 
            margin: 0 8px 8px; 
        }
        
        @keyframes fadeInDown { 
            from { opacity: 0; transform: translateY(-30px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
        
        .clock {
            font-size: 4rem; 
            font-weight: 200; 
            letter-spacing: 0.02em; 
            text-align: center;
            text-shadow: 0 0 40px var(--shadow-glow), 0 0 80px rgba(200,180,255,0.2);
            margin-bottom: 10px; 
            animation: clockPulse 3s ease-in-out infinite;
        }
        
        @keyframes clockPulse {
            0%, 100% { 
                transform: scale(1); 
                text-shadow: 0 0 40px var(--shadow-glow), 0 0 80px rgba(200,180,255,0.2); 
            }
            50% { 
                transform: scale(1.02); 
                text-shadow: 0 0 50px var(--shadow-glow), 0 0 100px rgba(200,180,255,0.3); 
            }
        }
        
        .date { 
            font-size: 1.1rem; 
            color: var(--text-secondary); 
            text-align: center; 
            opacity: 0.9; 
            animation: fadeIn 1.2s ease-out 0.3s both; 
        }
        
        @keyframes fadeIn { 
            from { opacity: 0; } 
            to { opacity: 1; } 
        }
        
        .main-content { 
            flex: 1; 
            overflow-y: auto; 
            overflow-x: hidden; 
            padding: 0 8px; 
        }
        
        .main-content::-webkit-scrollbar { width: 6px; }
        .main-content::-webkit-scrollbar-track { background: transparent; }
        .main-content::-webkit-scrollbar-thumb { 
            background: rgba(200, 180, 255, 0.3); 
            border-radius: 10px; 
        }
        .main-content::-webkit-scrollbar-thumb:hover { 
            background: rgba(200, 180, 255, 0.5); 
        }
        
        .content-section { 
            display: none; 
            animation: sectionSlideIn 0.5s cubic-bezier(0.16,1,0.3,1); 
        }
        
        .content-section.active { display: block; }
        
        @keyframes sectionSlideIn { 
            from { opacity: 0; transform: translateY(30px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
        
        .section-title {
            font-size: 1.8rem; 
            font-weight: 700; 
            margin: 20px 15px 20px; 
            display: flex; 
            align-items: center; 
            gap: 12px;
            color: var(--text-primary); 
            text-shadow: 0 2px 10px rgba(200, 180, 255, 0.3);
            animation: titleFadeIn 0.8s ease-out;
        }
        
        @keyframes titleFadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .section-title i { 
            color: var(--accent-purple-bright); 
            filter: drop-shadow(0 0 8px var(--shadow-glow));
            animation: iconBounceRotate 3s ease-in-out infinite;
        }
        
        @keyframes iconBounceRotate {
            0%, 100% { 
                transform: rotate(0deg) translateY(0) scale(1); 
            }
            25% { 
                transform: rotate(-15deg) translateY(-3px) scale(1.1); 
            }
            75% { 
                transform: rotate(15deg) translateY(-3px) scale(1.1); 
            }
        }
        
        .links-container {
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); 
            gap: 12px; 
            padding: 0 8px 20px;
        }
        
        .link-card {
            padding: 25px 15px; 
            border-radius: 20px; 
            text-decoration: none; 
            color: var(--text-primary);
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 12px; 
            transition: all 0.4s cubic-bezier(0.16,1,0.3,1);
            cursor: pointer;
            position: relative;
        }
        
        .link-card::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 22px;
            background: linear-gradient(
                135deg,
                rgba(200, 180, 255, 0.1) 0%,
                rgba(255, 255, 255, 0.05) 50%,
                rgba(200, 180, 255, 0.1) 100%
            );
            filter: blur(20px);
            opacity: 0;
            transition: opacity 0.4s ease;
            z-index: -1;
        }
        
        .link-card:hover::before {
            opacity: 1;
        }
        
        .link-card:hover {
            transform: translateY(-8px) scale(1.05);
            box-shadow: 
                0 15px 40px rgba(0, 0, 0, 0.5),
                0 0 30px rgba(200, 180, 255, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }
        
        .link-card i { 
            font-size: 2rem; 
            color: var(--accent-purple-bright); 
            filter: drop-shadow(0 4px 8px var(--shadow-glow)); 
        }
        
        .link-card span { 
            font-size: 0.95rem; 
            font-weight: 600; 
            text-align: center; 
        }
        
        .day-end-timer {
            margin: 0 8px 20px; 
            padding: 20px; 
            border-radius: 20px; 
            opacity: 0;
            transform: translateY(-20px); 
            transition: all 0.5s cubic-bezier(0.16,1,0.3,1);
            pointer-events: none;
            position: relative;
        }
        
        .day-end-timer::before {
            content: '';
            position: absolute;
            inset: -3px;
            border-radius: 23px;
            background: radial-gradient(
                circle at top right,
                rgba(200, 180, 255, 0.15) 0%,
                rgba(255, 255, 255, 0.05) 50%,
                transparent 100%
            );
            filter: blur(25px);
            z-index: -1;
        }
        
        .day-end-timer.show {
            opacity: 1; 
            transform: translateY(0); 
            pointer-events: all;
        }
        
        .timer-info { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }
        
        .timer-label h3 { 
            font-size: 1.2rem; 
            font-weight: 600; 
            margin-bottom: 5px; 
        }
        
        .timer-label p { 
            font-size: 0.9rem; 
            color: var(--text-secondary); 
            opacity: 0.8; 
        }
        
        .timer-count {
            font-size: 2rem; 
            font-weight: 700; 
            color: var(--accent-purple-bright);
            text-shadow: 0 0 20px var(--shadow-glow);
            animation: timerGlow 2s ease-in-out infinite;
        }
        
        @keyframes timerGlow {
            0%, 100% {
                text-shadow: 0 0 20px var(--shadow-glow);
                transform: scale(1);
            }
            50% {
                text-shadow: 0 0 30px var(--glow-intense), 0 0 50px rgba(200, 180, 255, 0.4);
                transform: scale(1.05);
            }
        }
        
        .schedule-list { 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
            padding: 0 8px 100px; 
        }
        
        .lesson-card {
            padding: 20px; 
            border-radius: 20px; 
            transition: all 0.4s cubic-bezier(0.16,1,0.3,1);
            animation: cardSlideIn 0.6s cubic-bezier(0.16,1,0.3,1) backwards;
            position: relative;
        }
        
        .lesson-card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 20px;
            background: linear-gradient(
                135deg,
                rgba(255, 255, 255, 0.06) 0%,
                rgba(255, 255, 255, 0.02) 100%
            );
            filter: blur(15px);
            z-index: -1;
        }
        
        .lesson-card:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 
                0 15px 50px rgba(200, 180, 255, 0.25),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }
        
        .lesson-card:nth-child(1) { animation-delay: 0.05s; }
        .lesson-card:nth-child(2) { animation-delay: 0.1s; }
        .lesson-card:nth-child(3) { animation-delay: 0.15s; }
        .lesson-card:nth-child(4) { animation-delay: 0.2s; }
        .lesson-card:nth-child(5) { animation-delay: 0.25s; }
        .lesson-card:nth-child(6) { animation-delay: 0.3s; }
        .lesson-card:nth-child(7) { animation-delay: 0.35s; }
        .lesson-card:nth-child(8) { animation-delay: 0.4s; }
        .lesson-card:nth-child(9) { animation-delay: 0.45s; }
        
        @keyframes cardSlideIn {
            from { opacity: 0; transform: translateX(-30px); }
            to { opacity: 1; transform: translateX(0); }
        }
        
        .lesson-card.current {
            border: 2px solid rgba(200, 180, 255, 0.4);
            box-shadow: 
                0 10px 40px rgba(200, 180, 255, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
            transform: scale(1.02);
            animation: currentPulse 2s ease-in-out infinite;
        }
        
        @keyframes currentPulse {
            0%, 100% {
                box-shadow: 
                    0 10px 40px rgba(200, 180, 255, 0.2),
                    inset 0 1px 0 rgba(255, 255, 255, 0.2);
            }
            50% {
                box-shadow: 
                    0 15px 50px rgba(200, 180, 255, 0.4),
                    inset 0 1px 0 rgba(255, 255, 255, 0.3);
            }
        }
        
        .lesson-card.finished { 
            opacity: 0.5; 
            transform: scale(0.98);
        }
        
        .lesson-card.finished:hover {
            opacity: 0.7;
        }
        
        .lesson-icon {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, rgba(200, 180, 255, 0.2), rgba(200, 180, 255, 0.1));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
            font-size: 1.3rem;
            transition: all 0.3s ease;
            flex-shrink: 0;
        }
        
        .lesson-card:hover .lesson-icon {
            transform: rotate(5deg) scale(1.1);
            background: linear-gradient(135deg, rgba(200, 180, 255, 0.3), rgba(200, 180, 255, 0.15));
        }
        
        .lesson-card.current .lesson-icon {
            animation: iconBounce 1s ease-in-out infinite;
        }
        
        @keyframes iconBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }
        
        .lesson-header {
            display: flex; 
            justify-content: space-between; 
            align-items: center;
        }
        
        .lesson-main {
            display: flex;
            align-items: center;
            flex: 1;
        }
        
        .lesson-info h3 { 
            font-size: 1.1rem; 
            font-weight: 600; 
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .lesson-info p { 
            font-size: 0.9rem; 
            color: var(--text-secondary); 
            opacity: 0.8; 
        }
        
        .lesson-status {
            font-size: 0.9rem; 
            font-weight: 600; 
            padding: 8px 14px; 
            border-radius: 12px;
            background: rgba(200, 180, 255, 0.15);
            color: var(--accent-purple-bright);
            white-space: nowrap;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        
        .lesson-status::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            animation: statusShine 3s ease-in-out infinite;
        }
        
        @keyframes statusShine {
            0% { left: -100%; }
            50%, 100% { left: 100%; }
        }
        
        .lesson-card.current .lesson-status {
            animation: statusPulse 1.5s ease-in-out infinite;
            box-shadow: 0 0 15px rgba(200, 180, 255, 0.4);
        }
        
        @keyframes statusPulse {
            0%, 100% {
                background: rgba(200, 180, 255, 0.15);
                transform: scale(1);
            }
            50% {
                background: rgba(200, 180, 255, 0.3);
                transform: scale(1.05);
            }
        }
        
        .lesson-progress {
            margin-top: 12px;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: visible;
            position: relative;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.3);
        }
        
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, 
                var(--accent-purple) 0%, 
                var(--accent-purple-bright) 50%, 
                var(--accent-purple) 100%);
            background-size: 200% 100%;
            border-radius: 4px;
            box-shadow: 
                0 0 15px var(--shadow-glow),
                0 0 30px rgba(200, 180, 255, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
            position: relative;
            animation: progressGlow 3s ease-in-out infinite;
            overflow: visible;
        }
        
        @keyframes progressGlow {
            0%, 100% { 
                background-position: 0% 50%;
                box-shadow: 
                    0 0 15px var(--shadow-glow),
                    0 0 30px rgba(200, 180, 255, 0.3);
            }
            50% { 
                background-position: 100% 50%;
                box-shadow: 
                    0 0 25px var(--shadow-glow),
                    0 0 50px rgba(200, 180, 255, 0.5);
            }
        }
        
        .progress-particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: var(--accent-purple-bright);

            const [hours, minutes] = timeStr.split(':').map(Number);
            const date = new Date();
            date.setHours(hours, minutes, 0, 0);
            return date;
        }

        function formatTime(ms) {
            const totalMinutes = Math.floor(ms / (1000 * 60));
            const hours = Math.floor(totalMinutes / 60);
            const minutes = totalMinutes % 60;
            return hours > 0 ? `${hours}ч ${minutes}м` : `${minutes} мин`;
        }

        // Particle effect for progress bar
        function createParticles(progressBar) {
            const existingParticles = progressBar.querySelectorAll('.progress-particle');
            existingParticles.forEach(p => p.remove());
            
            const width = progressBar.offsetWidth;
            const particleCount = Math.max(8, Math.floor(width / 25));
            
            for (let i = 0; i < particleCount; i++) {
                // Main sparkle particles
                const particle = document.createElement('div');
                const particleType = i % 3;
                
                if (particleType === 0) {
                    particle.className = 'progress-particle large';
                } else if (particleType === 1) {
                    particle.className = 'progress-particle';
                } else {
                    particle.className = 'progress-particle trail';
                }
                
                const position = (i / particleCount) * 100;
                const randomOffset = (Math.random() - 0.5) * 10;
                particle.style.left = `${Math.min(95, Math.max(5, position + randomOffset))}%`;
                particle.style.top = '50%';
                particle.style.transform = 'translate(-50%, -50%)';
                particle.style.animationDelay = `${i * 0.15}s`;
                progressBar.appendChild(particle);
            }
            
            // Add extra floating particles
            for (let i = 0; i < 5; i++) {
                const floater = document.createElement('div');
                floater.className = 'progress-particle trail';
                floater.style.left = `${Math.random() * 100}%`;
                floater.style.top = '50%';
                floater.style.animationDelay = `${Math.random() * 2}s`;
                progressBar.appendChild(floater);
            }
        }

        class SnowEffect {
            constructor() {
                this.canvas = document.getElementById('snowCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.snowflakes = [];
                this.maxSnowflakes = 250;
                this.resize();
                this.init();
                this.animate();
                window.addEventListener('resize', () => this.resize());
            }

            resize() {
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
            }

            init() {
                for (let i = 0; i < this.maxSnowflakes; i++) {
                    this.snowflakes.push({
                        x: Math.random() * this.canvas.width,
                        y: Math.random() * this.canvas.height,
                        radius: Math.random() * 4 + 1,
                        speed: Math.random() * 1.8 + 0.6,
                        wind: Math.random() * 1 - 0.5,
                        opacity: Math.random() * 0.8 + 0.2,
                        wobble: Math.random() * Math.PI * 2,
                        wobbleSpeed: Math.random() * 0.03 + 0.01
                    });
                }
            }

            update() {
                this.snowflakes.forEach(flake => {
                    flake.y += flake.speed;
                    flake.wobble += flake.wobbleSpeed;
                    flake.x += Math.sin(flake.wobble) * 0.6 + flake.wind;

                    if (flake.y > this.canvas.height) {
                        flake.y = -10;
                        flake.x = Math.random() * this.canvas.width;
                    }
                    if (flake.x > this.canvas.width) flake.x = 0;
                    else if (flake.x < 0) flake.x = this.canvas.width;
                });
            }

            draw() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                this.snowflakes.forEach(flake => {
                    this.ctx.beginPath();
                    this.ctx.arc(flake.x, flake.y, flake.radius, 0, Math.PI * 2);
                    this.ctx.fillStyle = `rgba(255, 255, 255, ${flake.opacity})`;
                    this.ctx.fill();

                    const gradient = this.ctx.createRadialGradient(flake.x, flake.y, 0, flake.x, flake.y, flake.radius * 3);
                    gradient.addColorStop(0, `rgba(200, 180, 255, ${flake.opacity * 0.4})`);
                    gradient.addColorStop(1, 'transparent');
                    this.ctx.beginPath();
                    this.ctx.arc(flake.x, flake.y, flake.radius * 3, 0, Math.PI * 2);
                    this.ctx.fillStyle = gradient;
                    this.ctx.fill();
                });
            }

            animate() {
                this.update();
                this.draw();
                requestAnimationFrame(() => this.animate());
            }
        }

        class ClockManager {
            constructor() {
                this.clockElement = document.getElementById('clock');
                this.dateElement = document.getElementById('date');
                this.update();
                setInterval(() => this.update(), 1000);
            }

            update() {
                const now = new Date();
                const timeStr = now.toLocaleTimeString('ru-RU', {
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit'
                });
                this.clockElement.textContent = timeStr;

                const dateStr = now.toLocaleDateString('ru-RU', {
                    weekday: 'long',
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric'
                });
                this.dateElement.textContent = dateStr.charAt(0).toUpperCase() + dateStr.slice(1);
            }
        }

        class ScheduleManager {
            constructor() {
                this.titleElement = document.getElementById('scheduleTitle');
                this.listElement = document.getElementById('scheduleList');
                this.timerElement = document.getElementById('dayEndTimer');
                this.update();
                setInterval(() => this.update(), 10000);
            }

            update() {
                const currentDay = getCurrentDay();
                const schedule = SCHEDULE_DATA[currentDay] || [];
                this.titleElement.textContent = `Расписание на ${currentDay}`;

                if (schedule.length === 1 && schedule[0].subject === 'ВЫХОДНОЙ') {
                    this.listElement.innerHTML = '<div class="loading"><i class="fas fa-mug-hot"></i> Сегодня выходной!</div>';
                    this.timerElement.classList.remove('show');
                    return;
                }

                const now = new Date();
                let currentLessonIndex = -1;
                let nextLessonIndex = -1;

                schedule.forEach((lesson, index) => {
                    const [startTime, endTime] = lesson.time.split(' - ');
                    const start = parseTime(startTime);
                    const end = parseTime(endTime);

                    if (now >= start && now <= end) {
                        currentLessonIndex = index;
                    } else if (now < start && nextLessonIndex === -1) {
                        nextLessonIndex = index;
                    }
                });

                this.updateDayEndTimer(schedule, now);
                this.listElement.innerHTML = schedule.map((lesson, index) =>
                    this.createLessonCard(lesson, index, currentLessonIndex, nextLessonIndex, now)
                ).join('');
                
                // Add particles to current lesson progress bar
                setTimeout(() => {
                    const currentCard = this.listElement.querySelector('.lesson-card.current .progress-bar');
                    if (currentCard) {
                        createParticles(currentCard);
                    }
                }, 100);
            }

            createLessonCard(lesson, index, currentIndex, nextIndex, now) {
                const [startTime, endTime] = lesson.time.split(' - ');
                const start = parseTime(startTime);
                const end = parseTime(endTime);

                let status = 'Ожидание';
                let cssClass = '';
                let progress = 0;

                if (index === currentIndex) {
                    const totalDuration = end - start;
                    const elapsed = now - start;
                    const remaining = end - now;

                    if (remaining > 0) {
                        const remainingMinutes = Math.floor(remaining / (1000 * 60));
                        status = `${remainingMinutes} мин`;
                        progress = Math.min(100, (elapsed / totalDuration) * 100);
                    } else {
                        status = 'Завершён';
                    }
                    cssClass = 'current';
                } else if (index === nextIndex) {
                    const timeUntil = start - now;
                    if (timeUntil > 0) {
                        const minutesUntil = Math.floor(timeUntil / (1000 * 60));
                        status = `Через ${minutesUntil} мин`;
                    }
                } else if (index < currentIndex) {
                    status = 'Завершён';
                    cssClass = 'finished';
                }

                const progressBar = (cssClass === 'current' && progress > 0) 
                    ? `<div class="lesson-progress"><div class="progress-bar" style="width: ${progress}%"></div></div>` 
                    : '';
                
                const icon = getSubjectIcon(lesson.subject);

                return `
                    <div class="lesson-card liquid-glass ${cssClass}">
                        <div class="lesson-header">
                            <div class="lesson-main">
                                <div class="lesson-icon">${icon}</div>
                                <div class="lesson-info">
                                    <h3>${lesson.subject}</h3>
                                    <p>${lesson.time}</p>
                                </div>
                            </div>
                            <div class="lesson-status">${status}</div>
                        </div>
                        ${progressBar}
                    </div>
                `;
            }

            updateDayEndTimer(schedule, now) {
                if (schedule.length === 0 || schedule[0].subject === 'ВЫХОДНОЙ') {
                    this.timerElement.classList.remove('show');
                    return;
                }

                const lastLesson = schedule[schedule.length - 1];
                const [, endTime] = lastLesson.time.split(' - ');
                const end = parseTime(endTime);
                const remaining = end - now;

                if (remaining > 0) {
                    this.timerElement.classList.add('show');
                    this.timerElement.innerHTML = `
                        <div class="timer-info">
                            <div class="timer-label">
                                <h3>До конца учебного дня</h3>
                                <p>Последний урок: ${lastLesson.subject}</p>
                            </div>
                            <div class="timer-count">${formatTime(remaining)}</div>
                        </div>
                    `;
                } else {
                    this.timerElement.classList.remove('show');
                }
            }
        }

        class CalendarManager {
            constructor() {
                this.currentDate = new Date();
                this.monthElement = document.getElementById('calendarMonth');
                this.daysElement = document.getElementById('calendarDays');

                document.getElementById('prevMonth').addEventListener('click', () => {
                    this.currentDate.setMonth(this.currentDate.getMonth() - 1);
                    this.render();
                });

                document.getElementById('nextMonth').addEventListener('click', () => {
                    this.currentDate.setMonth(this.currentDate.getMonth() + 1);
                    this.render();
                });

                this.render();
            }

            render() {
                const year = this.currentDate.getFullYear();
                const month = this.currentDate.getMonth();

                this.monthElement.textContent = `${MONTHS[month]} ${year}`;

                const firstDay = new Date(year, month, 1);
                const lastDay = new Date(year, month + 1, 0);
                const prevLastDay = new Date(year, month, 0);
                const firstDayWeekday = (firstDay.getDay() + 6) % 7;
                const lastDate = lastDay.getDate();
                const prevLastDate = prevLastDay.getDate();
                const today = new Date();

                let html = '';

                for (let i = firstDayWeekday; i > 0; i--) {
                    html += `<div class="calendar-day other-month">${prevLastDate - i + 1}</div>`;
                }

                for (let day = 1; day <= lastDate; day++) {
                    const date = new Date(year, month, day);
                    const isToday = date.toDateString() === today.toDateString();
                    const isWeekend = date.getDay() === 0 || date.getDay() === 6;

                    let className = 'calendar-day';
                    if (isToday) className += ' today';
                    if (isWeekend) className += ' weekend';

                    html += `<div class="${className}">${day}</div>`;
                }

                const totalCells = Math.ceil((firstDayWeekday + lastDate) / 7) * 7;
                const remainingCells = totalCells - (firstDayWeekday + lastDate);

                for (let day = 1; day <= remainingCells; day++) {
                    html += `<div class="calendar-day other-month">${day}</div>`;
                }

                this.daysElement.innerHTML = html;
            }
        }

        class NavigationManager {
            constructor() {
                this.buttons = document.querySelectorAll('.nav-button');
                this.sections = document.querySelectorAll('.content-section');

                this.buttons.forEach(button => {
                    button.addEventListener('click', () => {
                        const sectionId = button.getAttribute('data-section');
                        this.showSection(sectionId);
                    });
                });

                this.showSection('scheduleSection');
            }

            showSection(sectionId) {
                this.sections.forEach(section => section.classList.remove('active'));

                const targetSection = document.getElementById(sectionId);
                if (targetSection) targetSection.classList.add('active');

                this.buttons.forEach(button => {
                    if (button.getAttribute('data-section') === sectionId) {
                        button.classList.add('active');
                    } else {
                        button.classList.remove('active');
                    }
                });

                document.getElementById('mainContent').scrollTop = 0;
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            new SnowEffect();
            new ClockManager();
            new ScheduleManager();
            new CalendarManager();
            new NavigationManager();
        });
    </script>

    </div>

    <script>
        // Calculator logic
        let calcExpr = '';
        let calcJustEvaled = false;

        function calcUpdateDisplay() {
            document.getElementById('calcExpression').textContent = calcExpr;
            try {
                if (calcExpr) {
                    const safe = calcExpr.replace(/×/g,'*').replace(/÷/g,'/');
                    const val = Function('"use strict"; return (' + safe + ')')();
                    if (!isNaN(val) && isFinite(val)) {
                        document.getElementById('calcResult').textContent = parseFloat(val.toFixed(10)).toString();
                    }
                } else {
                    document.getElementById('calcResult').textContent = '0';
                }
            } catch(e) {}
        }

        function calcInput(ch) {
            if (calcJustEvaled && /[0-9.]/.test(ch)) { calcExpr = ''; }
            calcJustEvaled = false;
            calcExpr += ch;
            calcUpdateDisplay();
        }

        function calcClear() {
            calcExpr = '';
            calcJustEvaled = false;
            document.getElementById('calcResult').textContent = '0';
            document.getElementById('calcExpression').textContent = '';
        }

        function calcBackspace() {
            calcExpr = calcExpr.slice(0, -1);
            calcUpdateDisplay();
        }

        function calcToggleSign() {
            if (!calcExpr) return;
            if (calcExpr.startsWith('-')) calcExpr = calcExpr.slice(1);
            else calcExpr = '-' + calcExpr;
            calcUpdateDisplay();
        }

        function calcEquals() {
            try {
                const safe = calcExpr.replace(/×/g,'*').replace(/÷/g,'/');
                const val = Function('"use strict"; return (' + safe + ')')();
                if (!isNaN(val) && isFinite(val)) {
                    const result = parseFloat(val.toFixed(10)).toString();
                    document.getElementById('calcExpression').textContent = calcExpr + ' =';
                    document.getElementById('calcResult').textContent = result;
                    calcExpr = result;
                    calcJustEvaled = true;

                    // 🥚 Easter egg: if result is 67
                    if (result === '67') {
                        setTimeout(() => {
                            document.getElementById('easterEgg').classList.add('show');
                        }, 300);
                    }
                }
            } catch(e) {}
        }

        // Keyboard support for calculator
        document.addEventListener('keydown', function(e) {
            const calcVisible = document.getElementById('calcSection').classList.contains('active');
            if (!calcVisible) return;
            if (e.key >= '0' && e.key <= '9') calcInput(e.key);
            else if (e.key === '+') calcInput('+');
            else if (e.key === '-') calcInput('-');
            else if (e.key === '*') calcInput('*');
            else if (e.key === '/') { e.preventDefault(); calcInput('/'); }
            else if (e.key === '.') calcInput('.');
            else if (e.key === 'Enter' || e.key === '=') calcEquals();
            else if (e.key === 'Backspace') calcBackspace();
            else if (e.key === 'Escape') calcClear();
        });
    </script>
